[versions]
kotlin = "2.5.0-Beta2"
springBoot = "4.2.0-RC1"
springAi = "2.1.0-RC1"
springModulith = "2.2.0-RC1"
dataframe = "1.0.0-rc02"
datetime = "0.8.0"
jimmer = "0.12.4"
ksp = "2.3.12"
kotlinxImmutable = "0.5.2"
kotlinxIo = "0.9.2"

[libraries]
springBoot-bom = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "springBoot" }
springAi-bom = { module = "org.springframework.ai:spring-ai-bom", version.ref = "springAi" }
springModulith-bom = { module = "org.springframework.modulith:spring-modulith-bom", version.ref = "springModulith" }

springBoot-starter = { module = "org.springframework.boot:spring-boot-starter" }
springBoot-starterRestClient = { module = "org.springframework.boot:spring-boot-starter-restclient" }
springBoot-starterTest = { module = "org.springframework.boot:spring-boot-starter-test" }
springBoot-dockerCompose = { module = "org.springframework.boot:spring-boot-docker-compose" }
springBoot-starterActuator = { module = "org.springframework.boot:spring-boot-starter-actuator" }
springAi-starterMcpServerWebmvc = { module = "org.springframework.ai:spring-ai-starter-mcp-server-webmvc" }
springModulith-starterCore = { module = "org.springframework.modulith:spring-modulith-starter-core" }
springModulith-starterTest = { module = "org.springframework.modulith:spring-modulith-starter-test" }
springModulith-runtime = { module = "org.springframework.modulith:spring-modulith-runtime" }
kotlin-reflect = { module = "org.jetbrains.kotlin:kotlin-reflect" }
kotlinx-dataframe = { module = "org.jetbrains.kotlinx:dataframe", version.ref = "dataframe" }
kotlinx-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "datetime" }
kotlinx-collections-immutable = { module = "org.jetbrains.kotlinx:kotlinx-collections-immutable", version.ref = "kotlinxImmutable" }
kotlinx-io-core = { module = "org.jetbrains.kotlinx:kotlinx-io-core", version.ref = "kotlinxIo" }
kotlinx-io-bytestring = { module = "org.jetbrains.kotlinx:kotlinx-io-bytestring", version.ref = "kotlinxIo" }
kotlin-testJunit5 = { module = "org.jetbrains.kotlin:kotlin-test-junit5" }
junit-platformLauncher = { module = "org.junit.platform:junit-platform-launcher" }
jimmer-springBootStarter = { module = "org.babyfish.jimmer:jimmer-spring-boot-starter", version.ref = "jimmer" }
jimmer-ksp = { module = "org.babyfish.jimmer:jimmer-ksp", version.ref = "jimmer" }
postgresql = { module = "org.postgresql:postgresql" }
springBoot-starterFlyway = { module = "org.springframework.boot:spring-boot-starter-flyway" }
flyway-postgresql = { module = "org.flywaydb:flyway-database-postgresql" }
springBoot-testcontainers = { module = "org.springframework.boot:spring-boot-testcontainers" }
testcontainers-postgresql = { module = "org.testcontainers:testcontainers-postgresql" }
springBoot-configurationProcessor = { module = "org.springframework.boot:spring-boot-configuration-processor" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-spring = { id = "org.jetbrains.kotlin.plugin.spring", version.ref = "kotlin" }
kotlin-dataframe = { id = "org.jetbrains.kotlin.plugin.dataframe", version.ref = "kotlin" }
springBoot = { id = "org.springframework.boot", version.ref = "springBoot" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
kotlin-kapt = { id = "org.jetbrains.kotlin.kapt", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
