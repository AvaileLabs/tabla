name: tabla

services:
  postgres:
    image: postgres:18.6
    pull_policy: always

    environment:
      POSTGRES_DB: tabla
      POSTGRES_USER: tabla
      POSTGRES_PASSWORD: tabla

    ports:
      - target: 5432
        host_ip: 127.0.0.1

    tmpfs:
      - /var/lib/postgresql

    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\"" ]
      start_interval: 1s
      start_period: 30s