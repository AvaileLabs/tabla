spring:
  application:
    name: tabla

  ai:
    mcp:
      server:
        name: tabla
        type: SYNC
        protocol: MODERN
        capabilities:
          resource: false
          prompt: false
          completion: false
        modern:
          subscriptions: false

  docker:
    compose:
      lifecycle-management: start_only

  threads:
    virtual:
      enabled: true

  main:
    keep-alive: true

  modulith:
    runtime:
      verification-enabled: true

jimmer:
  language: kotlin
  dialect: org.babyfish.jimmer.sql.dialect.PostgresDialect
  database-validation-mode: error

tabla:
  edgar:
    user-agent: ${EDGAR_USER_AGENT:}
