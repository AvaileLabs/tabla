spring:
  application:
    name: tabla

  docker:
    compose:
      start:
        skip: never
        arguments:
          - --force-recreate

  threads:
    virtual:
      enabled: true

  main:
    keep-alive: true

  modulith:
    runtime:
      verification-enabled: true

jimmer:
  language: kotlin
  dialect: org.babyfish.jimmer.sql.dialect.PostgresDialect
  database-validation-mode: error
